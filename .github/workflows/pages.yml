name: Deploy Web (all branches)

# どのブランチを push しても、全ブランチをビルドして公開する。
#   /                 … 本番（main）。検索に出す設定・静的ページ・サイトマップつき
#   /branches/        … ブランチの一覧（確認用）
#   /<ブランチ名>/     … そのブランチの画面（"/" は "-" に置き換え）。検索には出さない（noindex）
# ※ 公開は Vercel に移しました（docs/vercel.md）。GitHub Pages に二重に公開すると、検索で重複するため、自動の実行は止めて、手動の実行だけにしています。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (all branches)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build every branch
        shell: bash
        run: |
          set -uo pipefail
          OUT="$GITHUB_WORKSPACE/_site"
          mkdir -p "$OUT"
          ROWS=""
          RESERVED=" assets site questions types about privacy branches "
          OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')"
          SITE_URL="https://$OWNER.github.io/${GITHUB_REPOSITORY#*/}/"
          PROD_OK=0
          # 本番：main を、サイトの根元（/）に、検索に出す設定でビルドする。
          if git show-ref --verify --quiet refs/remotes/origin/main; then
            wt="$RUNNER_TEMP/wt-production"
            git worktree add --detach "$wt" refs/remotes/origin/main >/dev/null 2>&1
            if [ -f "$wt/package.json" ] && [ -f "$wt/index.html" ]; then
              echo "::group::build production (main) -> /"
              if (cd "$wt" && npm ci --no-audit --no-fund && SITE_URL="$SITE_URL" SITE_INDEX=1 npx vite build --base ./ --outDir "$OUT" --emptyOutDir); then PROD_OK=1; else echo "::warning::build failed: production (main)"; fi
              echo "::endgroup::"
            fi
            git worktree remove --force "$wt" >/dev/null 2>&1 || true
          fi
          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin | grep -v '/HEAD$'); do
            branch="${ref#origin/}"
            slug="$(echo "$branch" | tr '/' '-')"
            case "$RESERVED" in *" $slug "*) echo "::warning::skip reserved name: $slug"; continue ;; esac
            wt="$RUNNER_TEMP/wt-$slug"
            git worktree add --detach "$wt" "$ref" >/dev/null 2>&1 || continue
            if [ -f "$wt/package.json" ] && [ -f "$wt/index.html" ]; then
              echo "::group::build $branch"
              if (cd "$wt" && npm ci --no-audit --no-fund && npx vite build --base ./ --outDir "$OUT/$slug" --emptyOutDir); then
                when="$(git log -1 --format=%cd --date=format:'%Y-%m-%d %H:%M' "$ref")"
                subject="$(git log -1 --format=%s "$ref" | sed 's/&/\&amp;/g; s/</\&lt;/g')"
                ROWS="$ROWS<a class=\"card\" href=\"../$slug/\"><b>$branch</b><span>$when</span><small>$subject</small></a>"
              else
                echo "::warning::build failed: $branch"
              fi
              echo "::endgroup::"
            fi
            git worktree remove --force "$wt" >/dev/null 2>&1 || true
          done
          mkdir -p "$OUT/branches"
          cat > "$OUT/branches/index.html" <<HTML
          <!doctype html>
          <html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>潮環占い｜ブランチ一覧</title>
          <style>
            body{margin:0;padding:24px 16px;background:#10172a;color:#fbf3e0;font:16px/1.6 system-ui,"Yu Gothic UI",sans-serif}
            h1{font-size:22px;margin:0 0 4px} p{color:#bac6dd;margin:0 0 20px}
            .card{display:block;max-width:640px;margin:0 auto 10px;padding:14px 16px;border:1px solid #414e6a;border-radius:16px;background:#1a243c;color:inherit;text-decoration:none}
            .card b{display:block;font-size:18px;color:#eacc8c} .card span{color:#bac6dd;font-size:13px} .card small{display:block;color:#bac6dd;margin-top:4px}
            .wrap{max-width:640px;margin:0 auto}
          </style></head><body>
          <div class="wrap"><h1>潮環占い｜ブランチ一覧</h1><p>見たいブランチをタップ。push のたびに自動で更新されます。</p></div>
          $ROWS
          </body></html>
          HTML
          # 本番（main）が作れなかったときは、これまでどおり、根元にブランチ一覧を置く。
          if [ "$PROD_OK" != 1 ]; then sed 's#href="../#href="./#g' "$OUT/branches/index.html" > "$OUT/index.html"; fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
