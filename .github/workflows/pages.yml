name: Deploy Web (all branches)

# どのブランチを push しても、全ブランチをビルドして、ブランチごとのページとして並べて公開する。
#   /                 … ブランチの一覧
#   /<ブランチ名>/     … そのブランチの画面（"/" は "-" に置き換え）
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (all branches)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build every branch
        shell: bash
        run: |
          set -uo pipefail
          OUT="$GITHUB_WORKSPACE/_site"
          mkdir -p "$OUT"
          ROWS=""
          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin | grep -v '/HEAD$'); do
            branch="${ref#origin/}"
            slug="$(echo "$branch" | tr '/' '-')"
            wt="$RUNNER_TEMP/wt-$slug"
            git worktree add --detach "$wt" "$ref" >/dev/null 2>&1 || continue
            if [ -f "$wt/package.json" ] && [ -f "$wt/index.html" ]; then
              echo "::group::build $branch"
              if (cd "$wt" && npm ci --no-audit --no-fund && npx vite build --base ./ --outDir "$OUT/$slug" --emptyOutDir); then
                when="$(git log -1 --format=%cd --date=format:'%Y-%m-%d %H:%M' "$ref")"
                subject="$(git log -1 --format=%s "$ref" | sed 's/&/\&amp;/g; s/</\&lt;/g')"
                ROWS="$ROWS<a class=\"card\" href=\"./$slug/\"><b>$branch</b><span>$when</span><small>$subject</small></a>"
              else
                echo "::warning::build failed: $branch"
              fi
              echo "::endgroup::"
            fi
            git worktree remove --force "$wt" >/dev/null 2>&1 || true
          done
          cat > "$OUT/index.html" <<HTML
          <!doctype html>
          <html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>潮環占い｜ブランチ一覧</title>
          <style>
            body{margin:0;padding:24px 16px;background:#10172a;color:#fbf3e0;font:16px/1.6 system-ui,"Yu Gothic UI",sans-serif}
            h1{font-size:22px;margin:0 0 4px} p{color:#bac6dd;margin:0 0 20px}
            .card{display:block;max-width:640px;margin:0 auto 10px;padding:14px 16px;border:1px solid #414e6a;border-radius:16px;background:#1a243c;color:inherit;text-decoration:none}
            .card b{display:block;font-size:18px;color:#eacc8c} .card span{color:#bac6dd;font-size:13px} .card small{display:block;color:#bac6dd;margin-top:4px}
            .wrap{max-width:640px;margin:0 auto}
          </style></head><body>
          <div class="wrap"><h1>潮環占い｜ブランチ一覧</h1><p>見たいブランチをタップ。push のたびに自動で更新されます。</p></div>
          $ROWS
          </body></html>
          HTML
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
